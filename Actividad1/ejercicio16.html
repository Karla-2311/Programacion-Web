<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de operaciones basicas</title>
<link rel="stylesheet" href="css/ejercicio16.css">

</head>
<body>
<div class="formulario">
    <h1>Calculadora</h1>
    <p class="subtitulo">Ingresa dos numeros y elige la operacion que quieres realizar.</p>

    <div class="ventana">
        <label for="numero1">Numero 1:</label>
        <input type="text" id="numero1" placeholder="Ej. 10">
    </div>

    <div class="ventana">
        <label for="numero2">Numero 2:</label>
        <input type="text" id="numero2" placeholder="Ej. 5">
    </div>

    <div class="btnsOperaciones">
        <button class="btnOperacion" onclick="calcularOperacion('suma')">Sumar</button>
        <button class="btnOperacion" onclick="calcularOperacion('resta')">Restar</button>
        <button class="btnOperacion" onclick="calcularOperacion('multiplicacion')">Multiplicar</button>
        <button class="btnOperacion" onclick="calcularOperacion('division')">Dividir</button>
    </div>

    <div class="resultados">
        <div class="ventana">
            <label for="resultado">Resultado:</label>
            <input type="text" id="resultado" readonly>
        </div>
    </div>
</div>
<script src="js/ejercicio16.js"></script>
</body>
</html>
