<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversora de kilometros a millas</title>
<link rel="stylesheet" href="css/ejercicio11.css">

</head>
<body>
    <div class="formulario">
        
    <h1>Conversora</h1>
    <p class="subtitulo">Conversión de Kilometros a millas</p>

    <div class="ventana">     
        <label for="Kilometros">Distancia en Kilometros</label>
        <div class="campo">
            <input type="text" id="kilometros" placeholder="Ej. 10">
            <div class="error" id="error"></div>
    </div>
    </div>
    <div class="ventana">
        <label for="millas">Conversion en millas</label>
        <div class="campo">
            <input type="text" id="millas" readonly>
        </div> 
    </div>
    <button id="btnConvertir" type="button">Convertir</button>
    </div>
    <script src="js/ejercicio11.js"></script>
</body>
</html>
