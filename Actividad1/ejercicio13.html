<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de edad</title>
<link rel="stylesheet" href="css/ejercicio13.css">

</head>
<body>
    <div class="formulario">
        
    <h1>Calculadora</h1>
    <p class="subtitulo">Calcular si una persona es mayor de edad</p>

    <div class="ventana">     
        <label for="edad">Edad</label>
        <div class="campo">
            <input type="text" id="edad" placeholder="Ej. 18">
            <div class="error" id="error"></div>
    </div>
    </div>
    <div class="ventana">
        <label for="votar">¿Puede votar?</label>
        <div class="mensaje">
            <input type="text" id="votar" readonly>
        </div> 
    </div>
    <button id="btnConvertir" type="button">Verificar</button>
    </div>
    <script src="js/ejercicio13.js"></script>
</body>
</html>
