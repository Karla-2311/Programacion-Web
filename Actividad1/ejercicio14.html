<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de numeros</title>
<link rel="stylesheet" href="css/ejercicio14.css">

</head>
<body>
<div class="formulario">
    <h1>Calculadora</h1>
    <p class="subtitulo">Ingresa varios numeros separados por comas y obten el mayor, el menor y el promedio.</p>

    <div class="ventana">
        <label for="entradaNumeros">Numeros:</label>
        <input type="text" id="entradaNumeros" placeholder="Ej. 10, 20, 30, 40, 50">
    </div>

    <p class="mensaje-error" id="mensajeError"></p>

    <button class="boton-enviar" id="botonCalcular">Calcular</button>

    <div class="resultados">
        <div class="ventana">
            <label for="cajaMayor">Numero mayor:</label>
            <input type="text" id="cajaMayor" readonly>
        </div>

        <div class="ventana">
            <label for="cajaMenor">Numero menor:</label>
            <input type="text" id="cajaMenor" readonly>
        </div>

        <div class="ventana">
            <label for="cajaPromedio">Promedio:</label>
            <input type="text" id="cajaPromedio" readonly>
        </div>
    </div>
</div>
    <script src="js/ejercicio14.js"></script>
</body>
</html>
