<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/ejercicio17.css">
<title>Tareas Pendientes</title>
</head>
<body>

<div class="formulario">
    <h1>Tareas Pendientes</h1>
    <p class="subtitulo">Agrega tus tareas.</p>

    <div class="ventana">
        <label for="entradaTarea">Nueva tarea:</label>
        <input type="text" id="entradaTarea" placeholder="Escribe una tarea">
    </div>

    <button class="btnenviar" id="btnAgregar">Agregar Tarea</button>

    <div class="resultados">
        <label>Tareas guardadas:</label>
        <ul class="listaTareas" id="listaTareas"></ul>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
