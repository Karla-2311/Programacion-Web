<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Celsius a Fahrenheit</title>
<link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>

  <div class="card">
    <h1>Calculadora</h1>
    <p class="subtitle">De grados Celsius a Fahrenheit</p>

    <div class="field">
      <label for="celsius">Temperatura en Celsius</label>
      <div class="input-row">
        <input type="text" id="celsius" placeholder="Ej. 25" autocomplete="off">
      </div>
      <div class="error-msg" id="error"></div>
    </div>

    <div class="field">
      <label for="fahrenheit">Conversion en Fahrenheit</label>
      <div class="input-row">
        <input type="text" id="fahrenheit" readonly>
      </div>
    </div>

    <button id="btnConvertir" type="button">Convertir</button>
  </div>

  <script src="js/ejercicio10.js"></script>
</body>
</html>
